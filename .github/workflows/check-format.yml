name: Check Format

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format Check
        id: format
        run: |
          pnpm format
          git diff > format.diff
          if [ -s format.diff ]; then
            echo "format_has_issues=true" >> "$GITHUB_OUTPUT"
            echo "diff=$(base64 -w0 format.diff)" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment PR
        if: steps.format.outputs.format_has_issues == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const diff = Buffer.from('${{ steps.format.outputs.diff }}', 'base64').toString();
            const files = diff.split('diff --git').slice(1);
            const formattedDiffs = files.map(file => {
              const filePath = file.split('\n')[0].match(/b\/(.*)/)[1];
              return `### 📝 ${filePath}\n\n\`\`\`diff\ndiff --git ${file}\`\`\`\n`;
            }).join('\n');

            const message = `
            ## ⚠️ Formatting Issues Found

            The following files have formatting issues:

            ${formattedDiffs}

            ### 💡 How to Fix
            Run \`pnpm format\` locally, then commit and push the changes.
            The pre-commit hook (lefthook, installed by \`pnpm install\`) formats staged files automatically.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
            core.setFailed('Format check failed');
