<!doctype html>
<html lang="ja" data-title-key="welcome.titlePrefix">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../ui/style.css" />
    <title></title>
  </head>
  <body class="welcome">
    <h1 class="appName"></h1>
    <p class="muted" data-i18n="app.subtitle"></p>

    <h2 data-i18n="welcome.h2Data"></h2>
    <p data-i18n="welcome.intro"></p>
    <ul>
      <li data-i18n="welcome.item.videoId"></li>
      <li data-i18n="welcome.item.title"></li>
      <li data-i18n="welcome.item.numbers"></li>
      <li data-i18n="welcome.item.time"></li>
      <li data-i18n="welcome.item.applied"></li>
      <li data-i18n="welcome.item.excluded"></li>
      <li data-i18n="welcome.item.reorder"></li>
      <li data-i18n="welcome.item.mix"></li>
    </ul>
    <p data-i18n="welcome.history"></p>
    <p data-i18n="welcome.noSend"></p>

    <h2 data-i18n="welcome.h2Overlap"></h2>
    <p data-i18n="welcome.overlap"></p>

    <h2 data-i18n="welcome.h2Control"></h2>
    <ul>
      <li data-i18n="welcome.stop"></li>
      <li data-i18n="welcome.delete"></li>
    </ul>

    <div class="toolbar" id="buttons">
      <button id="agree" class="primary" data-i18n="welcome.agree"></button>
      <button id="decline" data-i18n="welcome.decline"></button>
    </div>
    <p id="state" class="state" hidden></p>
    <div class="footer">
      <a href="licenses.html" target="_blank" id="openLicenses" data-i18n="footer.licenses"></a>
      <span class="spacer"></span>
      <label
        ><span data-i18n="lang.label"></span>
        <select id="uiLanguage">
          <option value="auto" data-i18n="lang.auto"></option>
          <option value="ja" data-i18n="lang.ja"></option>
          <option value="en" data-i18n="lang.en"></option></select
      ></label>
    </div>
    <script type="module" src="../ui/welcome.mts"></script>
  </body>
</html>
